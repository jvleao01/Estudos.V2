<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <title>Estudos · Calendário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="../assets/css/calendario.css">
</head>
<body>
  <main class="pagina pagina--calendario">
    <header class="topo">
      <div>
        <p class="topo__sub">Agenda</p>
        <h1 class="topo__titulo">Calendário</h1>
      </div>
      <button class="btn btn--sec btn-aulas" id="btn-aulas" type="button">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Aulas da semana
      </button>
    </header>

    <div class="cal-nav">
      <button class="btn-icone" id="mes-anterior" type="button" aria-label="Mês anterior">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h2 class="cal-nav__mes" id="mes-titulo" aria-live="polite">Mês</h2>
      <button class="btn-icone" id="mes-seguinte" type="button" aria-label="Próximo mês">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button class="btn btn--sec cal-nav__hoje" id="btn-hoje" type="button" hidden>Hoje</button>
    </div>

    <p class="cal-aviso" id="aviso-semestre" hidden></p>

    <div class="cal-layout">
      <section id="painel" class="cal-painel" aria-label="Calendário do mês"></section>
      <section id="dia" class="cal-dia" aria-live="polite"></section>
    </div>

    <ul class="cal-legenda" aria-label="Legenda">
      <li><span class="marca marca--aula" style="--cor: var(--accent)"></span>Aula</li>
      <li><span class="marca marca--prova"></span>Prova</li>
      <li><span class="marca marca--entrega"></span>Entrega</li>
      <li><span class="cal-legenda__feriado">15</span>Feriado</li>
    </ul>
  </main>

  <!-- Aulas da semana -->
  <dialog class="sheet" id="dlg-aulas" aria-labelledby="aulas-titulo">
    <form id="form-aulas" novalidate>
      <div class="sheet__alca" aria-hidden="true"></div>
      <h2 id="aulas-titulo">Aulas da semana</h2>

      <div class="campos-par">
        <label class="campo">
          <span>Início do semestre</span>
          <input name="inicio" type="date" required>
        </label>
        <label class="campo">
          <span>Fim do semestre</span>
          <input name="fim" type="date" required>
        </label>
      </div>

      <div id="tabela-aulas"></div>

      <p class="form-erro" id="aulas-erro" role="alert" hidden></p>

      <div class="sheet__acoes">
        <button type="button" class="btn btn--sec" data-fechar>Cancelar</button>
        <button type="submit" class="btn" id="btn-salvar-aulas">Salvar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="../../index.html" class="bottom-nav__item">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
      <span>Início</span>
    </a>
    <a href="materias.html" class="bottom-nav__item">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Matérias</span>
    </a>
    <a href="trabalhos.html" class="bottom-nav__item">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
      <span>Trabalhos</span>
    </a>
    <a href="notas.html" class="bottom-nav__item">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M2 20h20"/></svg>
      <span>Notas</span>
    </a>
    <a href="calendario.html" class="bottom-nav__item ativo" aria-current="page">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Calendário</span>
    </a>
    <a href="cronometro.html" class="bottom-nav__item">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M10 2h4"/></svg>
      <span>Cronômetro</span>
    </a>
    <a href="https://portal.siaaluno.com.br/sianet/Logon" class="bottom-nav__item" target="_blank" rel="noopener" data-faculdade>
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      <span>Faculdade</span>
    </a>
  </nav>

  <script src="../assets/js/materias-utils.js"></script>
  <script src="../assets/js/calendario-utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="../assets/js/animacoes.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/calendario.js"></script>
  <script src="../assets/js/menu.js"></script>
  <script src="../assets/js/universidade.js"></script>
</body>
</html>
