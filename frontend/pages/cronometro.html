<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <title>Estudos · Cronômetro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="../assets/css/cronometro.css">
</head>
<body>
  <main class="pagina">
    <header class="topo">
      <div>
        <p class="topo__sub" id="hoje">Hoje</p>
        <h1 class="topo__titulo">Cronômetro</h1>
      </div>
    </header>

    <section id="area" class="crono" hidden>
      <label class="campo crono__materia">
        <span>Matéria</span>
        <span class="crono__select">
          <span class="ponto" id="materia-cor" aria-hidden="true"></span>
          <select id="materia">
            <option value="">Escolha a matéria</option>
          </select>
        </span>
      </label>

      <div class="crono__mostrador" id="mostrador">
        <p class="crono__relogio" id="relogio" role="timer" aria-live="off">00:00:00</p>
        <p class="crono__estado" id="estado-texto" aria-live="polite"></p>
      </div>

      <div class="crono__controles">
        <button type="button" class="btn crono__principal" id="btn-iniciar" disabled>Iniciar</button>
        <button type="button" class="btn btn--sec" id="btn-pausar" hidden>Pausar</button>
        <button type="button" class="btn" id="btn-finalizar" hidden>Finalizar</button>
      </div>
      <button type="button" class="crono__cancelar" id="btn-cancelar" hidden>Cancelar sessão</button>
    </section>

    <div id="painel-vazio" class="estado" hidden>
      <p>Cadastre uma matéria em <a href="materias.html">Matérias</a> para começar.</p>
    </div>
    <div id="painel-erro"></div>
  </main>

  <!-- Resumo ao finalizar -->
  <dialog class="sheet" id="dlg-resumo" aria-labelledby="resumo-titulo">
    <div class="resumo">
    <div class="sheet__alca" aria-hidden="true"></div>
    <h2 id="resumo-titulo">Sessão</h2>
    <p class="resumo__tempo" id="resumo-tempo">0min</p>
    <p class="resumo__aviso" id="resumo-aviso" hidden>Sessão muito curta para salvar.</p>
    <p class="form-erro" id="resumo-erro" role="alert" hidden></p>
    <div class="sheet__acoes">
      <button type="button" class="btn btn--sec" id="btn-continuar">Continuar</button>
      <button type="button" class="btn" id="btn-salvar">Salvar</button>
    </div>
    <button type="button" class="crono__cancelar" id="btn-descartar">Descartar sessão</button>
    </div>
  </dialog>

  <!-- Confirmação -->
  <dialog class="sheet sheet--confirma" id="dlg-confirma" aria-labelledby="conf-titulo">
    <form method="dialog">
      <h2 id="conf-titulo">Confirmar</h2>
      <p id="conf-texto"></p>
      <div class="sheet__acoes">
        <button value="nao" class="btn btn--sec">Voltar</button>
        <button value="sim" class="btn" id="conf-ok">Confirmar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="../index.html" class="bottom-nav__item">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
      <span>Início</span>
    </a>
    <a href="materias.html" class="bottom-nav__item">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Matérias</span>
    </a>
    <a href="trabalhos.html" class="bottom-nav__item">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
      <span>Trabalhos</span>
    </a>
    <a href="cronometro.html" class="bottom-nav__item ativo" aria-current="page">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M10 2h4"/></svg>
      <span>Cronômetro</span>
    </a>
  </nav>

  <script src="../assets/js/dashboard-utils.js"></script>
  <script src="../assets/js/cronometro-utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/cronometro.js"></script>
</body>
</html>
