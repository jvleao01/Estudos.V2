<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <title>Estudos · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assetes/css/style.css">
</head>
<body>
  <main class="dashboard">
    <header class="topo">
      <div>
        <p class="topo__sub" id="semana-label">Semana</p>
        <h1 class="topo__titulo">Dashboard</h1>
      </div>
      <div class="topo__total">
        <span class="topo__total-label">Total na semana</span>
        <strong id="total-semana">0min</strong>
      </div>
    </header>

    <section class="card card--largo" aria-labelledby="t-materias">
      <div class="card__head">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15h4M7 10h9M7 5h6"/></svg>
        <h2 id="t-materias">Tempo por matéria</h2>
      </div>
      <div class="grafico grafico--barras" id="wrap-materias"><canvas id="chart-materias" role="img" aria-label="Gráfico de barras do tempo de estudo por matéria na semana"></canvas></div>
    </section>

    <section class="card" aria-labelledby="t-provas">
      <div class="card__head">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M12 14v3"/><path d="M12 19.5v.01"/></svg>
        <h2 id="t-provas">Próximas provas</h2>
      </div>
      <ul class="lista-provas" id="lista-provas"></ul>
    </section>

    <section class="card" aria-labelledby="t-dias">
      <div class="card__head">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>
        <h2 id="t-dias">Horas na semana</h2>
      </div>
      <div class="grafico" id="wrap-dias"><canvas id="chart-dias" role="img" aria-label="Gráfico de linha das horas estudadas por dia da semana"></canvas></div>
    </section>

    <section class="card" aria-labelledby="t-ranking">
      <div class="card__head">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
        <h2 id="t-ranking">Ranking de matérias</h2>
      </div>
      <ol class="ranking" id="lista-ranking"></ol>
    </section>

    <section class="card" aria-labelledby="t-pizza">
      <div class="card__head">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        <h2 id="t-pizza">Distribuição do tempo</h2>
      </div>
      <div class="grafico grafico--pizza" id="wrap-pizza"><canvas id="chart-pizza" role="img" aria-label="Gráfico de rosca com a proporção de tempo por matéria"></canvas></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="index.html" class="bottom-nav__item ativo" aria-current="page">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
      <span>Início</span>
    </a>
    <a href="materias.html" class="bottom-nav__item">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Matérias</span>
    </a>
    <a href="#" class="bottom-nav__item">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
      <span>Trabalhos</span>
    </a>
    <a href="#" class="bottom-nav__item">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      <span>Notas</span>
    </a>
    <a href="#" class="bottom-nav__item">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M10 2h4"/></svg>
      <span>Cronômetro</span>
    </a>
    <a href="#" class="bottom-nav__item">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Calendário</span>
    </a>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="assetes/js/data.js"></script>
  <script src="assetes/js/dashboard-utils.js"></script>
  <script src="assetes/js/app.js"></script>
</body>
</html>
